[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-pipeline"
version = "0.1.0"
description = "Render-in-the-loop video pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
  "manim==0.21.0",
  "numpy>=2.1,<3",
  "pillow>=11.0,<13",
  "pydantic==2.12.4",
  "scipy>=1.15,<2",
]

[project.scripts]
video-pipeline = "video_pipeline.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "integration: runs against the repository-local renderer and HTTP boundary",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "PGH", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["video_pipeline"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Explicit Any is forbidden; use a strict contract." }
"typing.cast" = { msg = "Type casts are forbidden; validate at the boundary." }

[tool.mypy]
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_generics = true
warn_unused_configs = true
