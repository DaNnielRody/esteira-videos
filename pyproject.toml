[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-pipeline"
version = "0.1.0"
description = "Local multi-scene video creation pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
  "manim==0.21.0",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<6",
  "pillow>=11.0,<13",
  "pydantic==2.12.4",
]

[project.scripts]
video-pipeline = "video_pipeline.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "integration: runs against the repository-local renderer and HTTP boundary",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "PGH", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["video_pipeline"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Explicit Any is forbidden; use a strict contract." }
"typing.cast" = { msg = "Type casts are forbidden; validate at the boundary." }

[tool.mypy]
# Keep bare ``mypy`` aligned with the same maintained boundary as the
# deterministic sandbox gate.  Dynamic JSON/media/provider/test seams remain
# covered by Ruff and behavioural tests, not by an unsound global exemption.
files = [
  "src/video_pipeline/video.py",
  "src/video_pipeline/pipeline.py",
  "src/video_pipeline/prompts.py",
  "src/video_pipeline/expectations.py",
  "src/video_pipeline/spec.py",
  "src/video_pipeline/theme.py",
  "src/video_pipeline/scene_plan.py",
  "src/video_pipeline/quality.py",
  "src/video_pipeline/capabilities.py",
  "src/video_pipeline/project.py",
  "src/video_pipeline/timeline.py",
  "src/video_pipeline/temporal.py",
  "src/video_pipeline/validation.py",
]
follow_imports = "silent"
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_generics = true
warn_unused_configs = true
