name: Quality and approved reference

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install renderer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            fonts-dejavu-core fonts-liberation \
            texlive-latex-extra texlive-fonts-recommended dvisvgm
      - name: Install locked Python dependencies
        run: uv sync --frozen --group dev
      - name: Check approved reference availability and hashes
        run: uv run python scripts/verify_direction_reference.py
      - name: Check golden direction excerpts and evidence
        run: uv run python scripts/verify_direction_catalog.py --probe
      - name: Lint maintained code
        run: uv run ruff check .
      - name: Check maintained type contracts
        run: |
          uv run mypy
          uv run mypy src/video_pipeline/direction.py src/video_pipeline/direction_contracts.py
      - name: Run deterministic regressions
        run: uv run pytest -q -m 'not integration'
